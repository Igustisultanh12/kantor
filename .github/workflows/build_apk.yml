name: Build SI SINDEN Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compile Release APK (Material 3)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Generate Local Properties & Versioning
        working-directory: sinden_mobile
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "flutter.versionCode=${{ github.run_number }}" >> android/local.properties
          echo "flutter.versionName=1.0.${{ github.run_number }}" >> android/local.properties

      - name: Install Dependencies
        working-directory: sinden_mobile
        run: flutter pub get

      - name: Run Unit & Widget Tests
        working-directory: sinden_mobile
        run: flutter test

      - name: Build Android Release APK
        working-directory: sinden_mobile
        run: flutter build apk --release --no-tree-shake-icons --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }}

      - name: Prepare Dynamic Versioned APK File
        run: |
          cp sinden_mobile/build/app/outputs/flutter-apk/app-release.apk SI-SINDEN-v1.0.${{ github.run_number }}.apk

      - name: Publish Release APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "SI SINDEN Mobile Android App v1.0.${{ github.run_number }}"
          body: "Aplikasi Mobile Resmi SI SINDEN - Detasemen Intelijen Kodaeral V Berbasis Google Material 3 Design (Build Version 1.0.${{ github.run_number }})."
          files: SI-SINDEN-v1.0.${{ github.run_number }}.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}